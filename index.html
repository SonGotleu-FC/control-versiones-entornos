<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de enteros</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
        h1 { font-size: 1.4em; }
        label { display: block; margin-top: 12px; }
        input, select, button { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 16px; cursor: pointer; }
        #resultado { margin-top: 20px; word-break: break-all; font-weight: bold; }
        .error { color: #b00020; }
    </style>
</head>
<body>
    <h1>Calculadora de enteros</h1>
    <p>Numeros enteros de hasta 5 digitos: de -99999 a 99999.</p>

    <form id="formulario">
        <label for="a">Primer numero (base en la potencia)</label>
        <input type="number" id="a" min="-99999" max="99999" step="1" required>

        <label for="op">Operacion</label>
        <select id="op">
            <option value="suma">Suma</option>
            <option value="resta">Resta</option>
            <option value="multiplicacion">Multiplicacion</option>
            <option value="potencia">Potencia</option>
        </select>

        <label for="b">Segundo numero (exponente en la potencia)</label>
        <input type="number" id="b" min="-99999" max="99999" step="1" required>

        <button type="submit">Calcular</button>
    </form>

    <p id="resultado"></p>

    <script>
        var MIN = -99999;
        var MAX = 99999;
        var MAX_CIFRAS = 100;

        function esEnteroValido(texto) {
            if (!/^-?[0-9]+$/.test(texto)) {
                return false;
            }
            var n = parseInt(texto, 10);
            return n >= MIN && n <= MAX;
        }

        function formatear(r) {
            var s = r.toString();
            if (s.length <= MAX_CIFRAS) {
                return s;
            }
            return s.substring(0, 50) + "... (" + s.length + " cifras)";
        }

        document.getElementById("formulario").addEventListener("submit", function (e) {
            e.preventDefault();
            var salida = document.getElementById("resultado");
            var ta = document.getElementById("a").value.trim();
            var tb = document.getElementById("b").value.trim();
            var op = document.getElementById("op").value;

            salida.className = "";

            if (!esEnteroValido(ta) || !esEnteroValido(tb)) {
                salida.className = "error";
                salida.textContent = "Introduce dos enteros entre -99999 y 99999.";
                return;
            }

            var a = BigInt(ta);
            var b = BigInt(tb);
            var r;

            if (op === "suma") {
                r = a + b;
            } else if (op === "resta") {
                r = a - b;
            } else if (op === "multiplicacion") {
                r = a * b;
            } else {
                if (b < 0n) {
                    salida.className = "error";
                    salida.textContent = "El exponente no puede ser negativo.";
                    return;
                }
                r = a ** b;
            }

            salida.textContent = "Resultado: " + formatear(r);
        });
    </script>
</body>
</html>
